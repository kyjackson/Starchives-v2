name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image/app tag to use (leave blank to auto-generate)'
        required: false
        default: ''
  push:
    tags: ['v*.*.*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RUNTIME: linux-x64
      OUT_DIR: out
      IMAGE_REPOSITORY: starchives            # <- single DOCR repo name
      REGISTRY: registry.digitalocean.com/${{ secrets.DOCR_REGISTRY }}
      PROJECT: Starchives/Starchives.csproj   # <- single-project layout

    outputs:
      image-digest: ${{ steps.docker_build.outputs.digest }}
      final-tag:    ${{ steps.v.outputs.TAG }}
      short-sha:    ${{ steps.v.outputs.SHORTSHA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve TAG + SHORTSHA + BUILDTIME
        id: v
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] && [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="manual-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          SHORTSHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          BUILDTIME="$(date -u +%FT%TZ)"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "SHORTSHA=$SHORTSHA" >> $GITHUB_OUTPUT
          echo "BUILDTIME=$BUILDTIME" >> $GITHUB_OUTPUT

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Ensure script execute bits
        run: chmod +x infra/*.sh

      - name: Publish self-contained app
        run: infra/publish.sh

      - name: Build EF migration bundle
        run: infra/build-efbundle.sh

      - name: Install doctl & login
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: infra/install-doctl.sh

      - name: Build & push image (tag, sha, latest)
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.OUT_DIR }}
          file: infra/Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.TAG }}
            BUILD_SHA=${{ steps.v.outputs.SHORTSHA }}
            BUILD_TIME=${{ steps.v.outputs.BUILDTIME }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.v.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:sha-${{ steps.v.outputs.SHORTSHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.title=Starchives
            org.opencontainers.image.version=${{ steps.v.outputs.TAG }}
            org.opencontainers.image.revision=${{ steps.v.outputs.SHORTSHA }}
            org.opencontainers.image.created=${{ steps.v.outputs.BUILDTIME }}
