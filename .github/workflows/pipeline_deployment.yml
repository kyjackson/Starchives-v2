name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image/app tag to use (leave blank to auto-generate)'
        required: false
        default: ''
  push:
    tags: ['v*.*.*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RUNTIME: linux-x64
      OUT_DIR: out
      IMAGE_NAME: starchives/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve TAG
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ "${REF_TYPE}" = "tag" ] && [ -n "${REF_NAME}" ]; then
            TAG="${REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            SHORTSHA="$(echo "${GIT_SHA}" | cut -c1-7)"
            TAG="manual-${SHORTSHA}"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved TAG=${TAG}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Publish the Blazor app (single project: Starchives/Starchives.csproj)
      - name: Publish self-contained app
        run: >
          dotnet publish Starchives/Starchives.csproj
          -c Release -r $RUNTIME --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true
          -o $OUT_DIR/app

      # Build a self-contained EF migration bundle (same project for --project and --startup-project)
      - name: Build EF migration bundle
        run: |
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations bundle \
            --project Starchives/Starchives.csproj \
            --startup-project Starchives/Starchives.csproj \
            --self-contained --target-runtime $RUNTIME \
            --output $OUT_DIR/app/efbundle

      # Create a minimal runtime Dockerfile right in the OUT_DIR
      - name: Create Dockerfile
        run: |
          cat > $OUT_DIR/Dockerfile <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y \
              ca-certificates curl tzdata libc6 libgcc1 libgssapi-krb5-2 libstdc++6 \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY app/ ./
          EXPOSE 8080
          CMD ["./Starchives"]
          EOF

      - name: Install doctl & login
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.118.0/doctl-1.118.0-linux-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/
          doctl auth init -t "${{ secrets.DO_TOKEN }}"
          doctl registry login

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.OUT_DIR }}
          push: true
          tags: |
            registry.digitalocean.com/${{ secrets.DOCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.TAG }}
            registry.digitalocean.com/${{ secrets.DOCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
