name: release

on:
  # manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image/app tag to use (leave blank to auto-generate)'
        required: false
        default: ''

  # automatic runs when you push a tag like v1.2.3
  push:
    tags: ['v*.*.*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RUNTIME: linux-x64
      OUT_DIR: out
      IMAGE_NAME: starchives/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Decide which tag to use:
      # 1) if the event is a tag push -> use that tag
      # 2) else if a manual input tag is provided -> use it
      # 3) else -> use manual-<shortsha>
      - name: Resolve TAG
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ "${REF_TYPE}" = "tag" ] && [ -n "${REF_NAME}" ]; then
            TAG="${REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            SHORTSHA="$(echo "${GIT_SHA}" | cut -c1-7)"
            TAG="manual-${SHORTSHA}"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved TAG=${TAG}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained app
        run: >
          dotnet publish Starchives/Starchives.Web/Starchives.Web.csproj
          -c Release -r $RUNTIME --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true
          -o $OUT_DIR/app

      - name: Build EF migration bundle
        run: |
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations bundle \
            --project Starchives/Starchives.Data/Starchives.Data.csproj \
            --startup-project Starchives/Starchives.Web/Starchives.Web.csproj \
            --self-contained --target-runtime $RUNTIME \
            --output $OUT_DIR/app/efbundle

      - name: Prepare Docker context
        run: cp Starchives/Dockerfile $OUT_DIR/Dockerfile

      - name: Install doctl & login
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.118.0/doctl-1.118.0-linux-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/
          doctl auth init -t "${{ secrets.DO_TOKEN }}"
          doctl registry login

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.OUT_DIR }}
          push: true
          tags: |
            registry.digitalocean.com/${{ secrets.DOCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.TAG }}
            registry.digitalocean.com/${{ secrets.DOCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
